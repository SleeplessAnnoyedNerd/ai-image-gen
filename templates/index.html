{% extends "base.html" %}
{% block content %}

<div class="bg-white rounded-2xl shadow p-8 space-y-6">

  <div class="flex justify-end -mt-2 -mb-4">
    <button type="button" id="adv-toggle"
            onclick="toggleAdvanced()"
            class="text-sm px-3 py-1 rounded-lg border border-gray-300
                   text-gray-500 hover:text-gray-700 hover:border-gray-400
                   transition-colors">
      ⚙ Advanced
    </button>
  </div>

  <form hx-post="/generate"
        hx-target="#result-area"
        hx-swap="outerHTML"
        hx-encoding="multipart/form-data"
        class="space-y-6">

    <!-- Recent prompts -->
    <div id="prompt-history-wrap" {% if not prompts %}hidden{% endif %}>
      <label class="block text-sm font-medium text-gray-600 mb-1" for="prompt-history">
        {{ t.prompt_history }}
      </label>
      <select id="prompt-history"
              class="w-full border border-gray-300 rounded-lg p-2 text-sm bg-white
                     focus:outline-none focus:ring-2 focus:ring-blue-400">
        <option value="">— {{ t.prompt_history }} —</option>
        {% for p in prompts %}
        <option value="{{ p.text }}">{{ p.text[:40] | replace('\n', ' ') }}{% if p.text | length > 40 %}…{% endif %}</option>
        {% endfor %}
      </select>
    </div>

    <!-- Prompt -->
    <div>
      <label class="block text-lg font-semibold text-gray-700 mb-2">
        {{ t.prompt_label }}
      </label>
      <textarea name="prompt" rows="3" required maxlength="2000"
                class="w-full border border-gray-300 rounded-xl p-3 text-lg
                       focus:outline-none focus:ring-2 focus:ring-blue-400"
                placeholder="Describe what you want to create…"></textarea>
    </div>

    <script>
      (function() {
        var wrap = document.getElementById('prompt-history-wrap');
        var sel  = document.getElementById('prompt-history');
        var ta   = document.querySelector('textarea[name="prompt"]');
        var MAX  = 25;

        function label(text) {
          var flat = text.replace(/\n/g, ' ');
          if (flat.length > 40) {
            return (flat.slice(0, 40) + '…');
          } else {
            return flat;
          }
        }

        sel.addEventListener('change', function() {
          // Read this.value before focusing the textarea: ta.focus() fires
          // 'blur' on sel synchronously, and the blur listener below resets
          // selectedIndex to 0 — reading this.value after that point would
          // read back the placeholder's empty value instead of the pick.
          var picked = this.value;
          if (picked) {
            ta.focus();
            ta.select();
            // execCommand is deprecated, but it is the only way to make a
            // programmatic edit undoable — measured in Firefox 140:
            // setRangeText leaves no undo entry, insertText does. Losing an
            // in-progress prompt to a stray pick should be recoverable.
            document.execCommand('insertText', false, picked);
          }
        });

        sel.addEventListener('blur', function() {
          // Reset once focus leaves, so picking the same entry twice works.
          this.selectedIndex = 0;
        });

        /* Keep the dropdown current: the form submits via htmx, so the page
         * never reloads and the server-rendered list would otherwise go stale.
         * A second htmx:configRequest listener is safe — listeners fire in
         * registration order and this one touches only the select, while the
         * upload handler below touches only evt.detail.parameters. */
        document.querySelector('form[hx-post]').addEventListener('htmx:configRequest', function() {
          var p = ta.value.trim();
          if (!p) {
            return;
          }
          // Drop any existing entry with the same text. Compare values directly
          // rather than building an attribute selector — CSS.escape escapes CSS
          // identifiers, not quoted selector strings, so a prompt containing a
          // double quote would break querySelector.
          for (var i = (sel.options.length - 1); i >= 1; i--) {
            if (sel.options[i].value === p) {
              sel.remove(i);
            }
          }
          var opt = document.createElement('option');
          opt.value       = p;
          opt.textContent = label(p);
          // options[1] is undefined when only the placeholder remains;
          // insertBefore(node, null) appends, which is what we want.
          sel.insertBefore(opt, (sel.options[1] || null));
          // The wrapper starts hidden on a fresh install; the first inserted
          // option is the signal that there is now something to show.
          wrap.hidden = false;
          while (sel.options.length > (MAX + 1)) {
            sel.remove(sel.options.length - 1);
          }
        });
      })();
    </script>

    <!-- Image upload -->
    <div>
      <label class="block text-lg font-semibold text-gray-700 mb-2">
        {{ t.upload_label }}
      </label>
      <input type="file" name="images" id="image-input"
             accept="image/*" multiple
             class="block w-full text-lg text-gray-600
                    file:mr-4 file:py-2 file:px-4
                    file:rounded-xl file:border-0
                    file:text-lg file:font-semibold
                    file:bg-blue-50 file:text-blue-700
                    hover:file:bg-blue-100" />
      <div id="image-grid" class="mt-3 flex flex-wrap gap-3"></div>
      <p id="upload-max-hint" class="text-sm text-gray-500 mt-1 hidden">{{ t.upload_max }}</p>
    </div>
    <script>
      (function() {
        var input     = document.getElementById('image-input');
        var grid      = document.getElementById('image-grid');
        var hint      = document.getElementById('upload-max-hint');
        var MAX       = 10;
        // Prevent duplicate registrations during development.
        if (input._ready) { return; }
        input._ready = true;

        /* ---- Preview helpers ---- */

        function addPreview(file, idx) {
          var card = document.createElement('div');
          card.style.cssText =
            'position:relative;width:120px;height:120px;border-radius:8px;overflow:hidden;' +
            'border:1px solid #e5e7eb';

          var img = document.createElement('img');
          img.src         = URL.createObjectURL(file);
          img.alt         = file.name;
          img.className   = 'w-full h-full object-cover';
          img.draggable   = false;
          img.__file__    = file;
          card.appendChild(img);

          var btn = document.createElement('button');
          btn.type = 'button';
          btn.innerHTML = '&times;';
          btn.title  = 'Remove ' + file.name;
          btn.style.cssText =
            'position:absolute;top:4px;right:4px;' +
            'background:rgba(0,0,0,.55);color:#fff;border:none;border-radius:50%;' +
            'width:24px;height:24px;font-size:14px;line-height:24px;text-align:center;' +
            'cursor:pointer;padding:0;';
          btn.addEventListener('click', function(e) {
            e.preventDefault();
            card.remove();
            URL.revokeObjectURL(img.src);
            rebuildFiles(input, grid);
            updateVisibility(input, grid, hint, MAX);
          });
          card.appendChild(btn);

          grid.appendChild(card);
        }

        function rebuildFiles(input, grid) {
          if (!(input && input.files)) { return; }
          var dt = new DataTransfer();
          var items = grid.querySelectorAll('div > img');
          for (var i = 0; i < items.length; i++) {
            dt.items.add(items[i].__file__);
          }
          input.files = dt.files;
        }

        function updateVisibility(input, grid, hint, maxCount) {
          var remaining = maxCount - grid.children.length;
          if (remaining <= 0) {
            input.style.display = 'none';
            hint.classList.remove('hidden');
          } else {
            input.style.display = '';
            hint.classList.add('hidden');
          }
        }

        /* ---- Event listeners ---- */

        input.addEventListener('change', function(e) {
          // Read native FileList BEFORE any sync (no getter override active).
          var selected = this.files;
          if (!selected || (selected.length === 0)) { return; }
          for (var i = 0; i < selected.length; i++) {
            if ((grid.children.length) >= MAX) { break; }
            var f = selected[i];
            // Skip files already shown in the grid.
            var found = false;
            grid.querySelectorAll('div > img').forEach(function(el) {
              if (el.__file__ === f) { found = true; }
            });
            if (found) { continue; }
            addPreview(f, grid.children.length);
          }
          rebuildFiles(input, grid);
          updateVisibility(input, grid, hint, MAX);
          this.value = '';
        });

        /* Intercept htmx submit: add grid files to the request parameters.
         * htmx 2.x ignores evt.detail.formData — it reads evt.detail.parameters
         * (a proxy over the underlying FormData). Mutate parameters directly. */
        document.querySelector('form[hx-post]').addEventListener('htmx:configRequest', function(evt) {
          var params = evt.detail.parameters;
          // Remove the (empty) file input entry.
          params.delete('images');
          // Append grid files.
          var imgs = grid.querySelectorAll('div > img');
          for (var i = 0; i < imgs.length; i++) {
            params.append('images', imgs[i].__file__);
          }
        });
      })();
    </script>


    <!-- Advanced model selection panel -->
    <div id="adv-panel" class="hidden space-y-3 border border-gray-200 rounded-xl p-4 bg-gray-50">
      <p class="text-sm font-semibold text-gray-500 uppercase tracking-wide">Model selection</p>

      {% if image_backends | length > 1 %}
      <div>
        <label class="block text-sm font-medium text-gray-600 mb-1">{{ t.model_image_backend }}</label>
        <select id="image-backend-select" name="image_backend"
                class="w-full border border-gray-300 rounded-lg p-2 text-sm bg-white
                       focus:outline-none focus:ring-2 focus:ring-blue-400">
          {% for name in image_backends.keys() %}
          <option value="{{ name }}" {% if name == image_default_backend %}selected{% endif %}>{{ name }}</option>
          {% endfor %}
        </select>
      </div>
      {% endif %}

      <div id="image-model-field" {% if image_backends[image_default_backend].model | length <= 1 %}class="hidden"{% endif %}>
        <label class="block text-sm font-medium text-gray-600 mb-1">{{ t.model_image }}</label>
        <select name="image_model" id="image-model-select"
                class="w-full border border-gray-300 rounded-lg p-2 text-sm bg-white
                       focus:outline-none focus:ring-2 focus:ring-blue-400">
          {% for m in image_backends[image_default_backend].model %}
          <option value="{{ m }}">{{ m }}</option>
          {% endfor %}
        </select>
      </div>

      <div id="image-model-edit-field" {% if image_backends[image_default_backend].model_edit | length <= 1 %}class="hidden"{% endif %}>
        <label class="block text-sm font-medium text-gray-600 mb-1">{{ t.model_image_edit }}</label>
        <select name="image_model_edit" id="image-model-edit-select"
                class="w-full border border-gray-300 rounded-lg p-2 text-sm bg-white
                       focus:outline-none focus:ring-2 focus:ring-blue-400">
          {% for m in image_backends[image_default_backend].model_edit %}
          <option value="{{ m }}">{{ m }}</option>
          {% endfor %}
        </select>
      </div>

      <script>
        (function() {
          var backendModels = {{ image_backends | tojson }};
          var backendSelect = document.getElementById('image-backend-select');
          if (!backendSelect) { return; }

          function rebuild(select, models) {
            select.innerHTML = '';
            models.forEach(function(m) {
              var opt = document.createElement('option');
              opt.value = m;
              opt.textContent = m;
              select.appendChild(opt);
            });
          }

          backendSelect.addEventListener('change', function() {
            var models = backendModels[backendSelect.value];
            var modelField = document.getElementById('image-model-field');
            var editField  = document.getElementById('image-model-edit-field');
            rebuild(document.getElementById('image-model-select'), models.model);
            rebuild(document.getElementById('image-model-edit-select'), models.model_edit);
            modelField.classList.toggle('hidden', models.model.length <= 1);
            editField.classList.toggle('hidden', models.model_edit.length <= 1);
          });
        })();
      </script>

      {% if video_models_text | length > 1 %}
      <div>
        <label class="block text-sm font-medium text-gray-600 mb-1">{{ t.model_video_text }}</label>
        <select name="video_model_text"
                class="w-full border border-gray-300 rounded-lg p-2 text-sm bg-white
                       focus:outline-none focus:ring-2 focus:ring-blue-400">
          {% for m in video_models_text %}
          <option value="{{ m }}">{{ m }}</option>
          {% endfor %}
        </select>
      </div>
      {% endif %}

      {% if video_models_image | length > 1 %}
      <div>
        <label class="block text-sm font-medium text-gray-600 mb-1">{{ t.model_video_image }}</label>
        <select name="video_model_image"
                class="w-full border border-gray-300 rounded-lg p-2 text-sm bg-white
                       focus:outline-none focus:ring-2 focus:ring-blue-400">
          {% for m in video_models_image %}
          <option value="{{ m }}">{{ m }}</option>
          {% endfor %}
        </select>
      </div>
      {% endif %}
    </div>

    <!-- Output type buttons -->
    <div class="flex gap-4 pt-2 flex-wrap">
      <button type="submit" name="output_type" value="image"
              class="flex-1 py-4 text-xl font-bold rounded-2xl
                     bg-blue-600 hover:bg-blue-700 text-white
                     transition-colors">
        {{ t.generate_image }}
      </button>
      <button type="submit" name="output_type" value="video"
              class="flex-1 py-4 text-xl font-bold rounded-2xl
                     bg-purple-600 hover:bg-purple-700 text-white
                     transition-colors">
        {{ t.generate_video }}
      </button>
      {% if sd_enabled %}
      <button id="sd-btn" type="submit" name="output_type" value="sd" disabled
              class="flex-1 py-4 text-xl font-bold rounded-2xl
                     bg-orange-300 text-white transition-colors cursor-wait">
        {{ t.sd_checking }}
      </button>
      <script>
        fetch('/sd-status')
          .then(function(r) { return r.json(); })
          .then(function(data) {
            var btn = document.getElementById('sd-btn');
            if (data.online) {
              btn.disabled = false;
              btn.textContent = {{ t.generate_sd | tojson }};
              btn.className = btn.className
                .replace('bg-orange-300', 'bg-orange-600 hover:bg-orange-700')
                .replace('cursor-wait', 'cursor-pointer');
            } else {
              btn.textContent = {{ t.sd_offline | tojson }};
              btn.className = btn.className.replace('cursor-wait', 'cursor-not-allowed');
            }
          });
      </script>
      {% endif %}
    </div>

  </form>

  <!-- Result area replaced by htmx -->
  <div id="result-area"></div>

</div>

<script>
  function toggleAdvanced() {
    var panel = document.getElementById('adv-panel');
    var btn   = document.getElementById('adv-toggle');
    var isNowHidden = panel.classList.toggle('hidden');
    localStorage.setItem('adv-open', isNowHidden ? '0' : '1');
    btn.classList.toggle('bg-gray-100', !isNowHidden);
  }
  if (localStorage.getItem('adv-open') === '1') {
    document.getElementById('adv-panel').classList.remove('hidden');
    document.getElementById('adv-toggle').classList.add('bg-gray-100');
  }
</script>

{% endblock %}
