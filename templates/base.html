<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ t.title }}</title>
  <script src="https://unpkg.com/htmx.org@2.0.4/dist/htmx.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen">

  <!-- Header -->
  <header class="bg-white shadow-sm py-4 px-6 flex items-center justify-between">
    <h1 class="text-2xl font-bold text-gray-800">{{ t.title }}</h1>
    <form method="post" action="/lang">
      <button type="submit" name="lang" value="{{ t.lang_switch_target }}"
              class="text-sm px-4 py-2 rounded bg-gray-200 hover:bg-gray-300 font-medium">
        {{ t.lang_switch }}
      </button>
    </form>
  </header>

  <main class="max-w-2xl mx-auto mt-10 px-4">
    {% block content %}{% endblock %}
  </main>

</body>
</html>
