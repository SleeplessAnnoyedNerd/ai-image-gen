<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ t.title }}</title>
  <script src="https://unpkg.com/htmx.org@2.0.4/dist/htmx.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen">

  <!-- Header -->
  <header class="bg-white shadow-sm py-4 px-6 flex items-center justify-between">
    <h1 class="text-2xl font-bold text-gray-800">{{ t.title }}</h1>
    <div class="flex items-center gap-3">
      {% if git_hash %}
      <span class="text-xs text-gray-400 font-mono">{{ git_hash }}</span>
      {% endif %}
      <form method="post" action="/lang">
        <input type="hidden" name="next" value="{{ request.path }}">
        <button type="submit" name="lang" value="{{ t.lang_switch_target }}"
                class="text-sm px-4 py-2 rounded bg-gray-200 hover:bg-gray-300 font-medium">
          {{ t.lang_switch }}
        </button>
      </form>
    </div>
  </header>

  <main class="max-w-2xl mx-auto mt-10 px-4">
    {% block content %}{% endblock %}
  </main>

</body>
</html>
