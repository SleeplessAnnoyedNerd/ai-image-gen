<div id="result-area" class="mt-6 space-y-4">

  <video src="{{ video_url }}" controls
         class="w-full rounded-2xl shadow-lg"></video>

  <div class="flex gap-4">
    <a href="/download/{{ job_id }}"
       class="flex-1 text-center py-3 text-lg font-bold rounded-2xl
              bg-green-600 hover:bg-green-700 text-white transition-colors">
      {{ t.download }}
    </a>
    <button onclick="document.getElementById('result-area').innerHTML=''"
            class="flex-1 py-3 text-lg font-bold rounded-2xl
                   bg-gray-200 hover:bg-gray-300 text-gray-700 transition-colors">
      {{ t.try_again }}
    </button>
  </div>

</div>
