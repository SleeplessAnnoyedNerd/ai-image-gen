<div id="result-area" class="mt-6 bg-red-50 border border-red-200
                              rounded-2xl p-6 text-center space-y-3">

  <p class="text-lg text-red-700 font-semibold">{{ message }}</p>

  <button onclick="document.getElementById('result-area').innerHTML=''"
          class="px-6 py-3 text-lg font-bold rounded-2xl
                 bg-red-100 hover:bg-red-200 text-red-700 transition-colors">
    {{ t.try_again }}
  </button>

</div>
