[paths]
# Everything the app writes — logs/, .cache/, prompts.db — lives here.
# Relative values are resolved against the project root, so the app writes
# to the same place no matter where it is launched from.
data_dir = "."

[flask]
secret_key = "SpayzDajoz"
port = 5005

[image]
default_backend = "dashscope"

[image.dashscope]
api_url = "https://token-plan.ap-southeast-1.maas.aliyuncs.com/api/v1/services/aigc/multimodal-generation/generation"
model = ["wan2.7-image", "wan2.7-image-pro"]
model_edit = ["wan2.7-image"]

[image.fal]
api_url = "https://fal.run"
model = ["fal-ai/flux/schnell"]
model_edit = ["fal-ai/gpt-image-1.5/edit", "fal-ai/flux-2/klein/9b/base/edit/lora"]

[image.dummy]
api_url    = "dummy://local"
api_key    = "dummy"
model      = ["dummy/instant"]
model_edit = ["dummy/instant"]

[video]
backend = "dashscope"
api_url = "https://dashscope-intl.aliyuncs.com/api/v1/services/aigc/video-generation/video-synthesis"
model_image = ["wan2.7-r2v"]
model_text = ["wan2.7-t2v"]
# api_version = "2025-04-01-preview"  # only for azure backend
# azure_path = "openai/deployments/{deployment}/videos/generations"

[sd]
api_url = "http://192.168.0.78:9090"
model = "Juggernaut XL v9"

[prompts]
# Prompts used fewer than this many times are hidden from the default list.
# Search always sees every prompt regardless of this value. Every row starts
# at 1 after the use_count migration, so raise this only once counts have grown.
min_use_count = 1
